[package]
name = "coupon-ledger"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Sorodeal — permissionless tokenized coupons / redeemable codes on Soroban (Burn + Tally profiles)"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.0"

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
