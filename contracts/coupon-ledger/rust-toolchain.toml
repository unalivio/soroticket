# Pinned toolchain for reproducible Wasm builds (ADR-009).
# Anyone building the contract gets the same compiler + target, so a fresh
# `stellar contract build` reproduces the deployed wasm hash recorded in
# deployments/testnet.json.
[toolchain]
channel = "1.94.1"
targets = ["wasm32v1-none", "wasm32-unknown-unknown"]
components = ["clippy", "rustfmt"]
profile = "minimal"
